# One stack for the whole project: HDFS + Spark + Neo4j/GDS + Jupyter (+ app services).
# Run from the repo root via the Makefile, which passes --env-file .env.
#   make up              -> lite stack: this file + docker-compose.lite.yml (~5.9 GB limits)
#   make up STACK=full   -> full stack: this file only (~9.8 GB limits)
# Lite only drops datanode2/spark-worker2 and shrinks limits; service names, network,
# volumes and ports are identical, so data and code work unchanged on both.
name: kg

x-hadoop: &hadoop
  platform: linux/amd64          # bde2020 images are amd64-only (Rosetta on Apple Silicon)
  env_file: hadoop.env
  restart: unless-stopped
  networks: [kgnet]

x-spark: &spark
  # Spark master/workers use the same image as the Jupyter driver (Spark 3.5.0 + Python 3.11),
  # so driver and executors always have identical Python, pandas and pyarrow versions.
  image: kg/pyspark:3.5.0
  restart: unless-stopped
  networks: [kgnet]
  environment:
    SPARK_NO_DAEMONIZE: "true"
    SPARK_DAEMON_MEMORY: 256m
    SPARK_LOG_DIR: /tmp/spark-logs
    SPARK_PID_DIR: /tmp
    SPARK_WORKER_DIR: /tmp/spark-work

services:
  # ---------------- HDFS ----------------
  namenode:
    <<: *hadoop
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: namenode
    hostname: namenode
    environment:
      CLUSTER_NAME: kg
      HDFS_CONF_dfs_replication: "2"
    ports:
      - "127.0.0.1:9870:9870"
    volumes:
      - namenode:/hadoop/dfs/name
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9870/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  datanode1:
    <<: *hadoop
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode1
    hostname: datanode1
    environment:
      SERVICE_PRECONDITION: "namenode:9870"
    depends_on:
      namenode: {condition: service_healthy}
    volumes:
      - datanode1:/hadoop/dfs/data
    mem_limit: 512m
    healthcheck: &dn-health
      test: ["CMD", "curl", "-fs", "http://localhost:9864/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  datanode2:
    <<: *hadoop
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode2
    hostname: datanode2
    environment:
      SERVICE_PRECONDITION: "namenode:9870"
    depends_on:
      namenode: {condition: service_healthy}
    volumes:
      - datanode2:/hadoop/dfs/data
    mem_limit: 512m
    healthcheck: *dn-health

  # ---------------- Spark ----------------
  # Course compose ran start-master.sh + tail, and had the "spark\u0002master" typo in the
  # worker URL. Here daemons run in the foreground (SPARK_NO_DAEMONIZE) and the URL is fixed.
  spark-master:
    <<: *spark
    container_name: spark-master
    hostname: spark-master
    command: ["/usr/local/spark/sbin/start-master.sh", "--host", "spark-master"]
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:7077:7077"
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  spark-worker1:
    <<: *spark
    container_name: spark-worker1
    hostname: spark-worker1
    command: ["/usr/local/spark/sbin/start-worker.sh", "spark://spark-master:7077", "--cores", "2", "--memory", "1g"]
    depends_on:
      spark-master: {condition: service_healthy}
    ports:
      - "127.0.0.1:8081:8081"
    mem_limit: 1536m
    healthcheck: &worker-health
      test: ["CMD", "curl", "-fs", "http://localhost:8081/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  spark-worker2:
    <<: *spark
    container_name: spark-worker2
    hostname: spark-worker2
    command: ["/usr/local/spark/sbin/start-worker.sh", "spark://spark-master:7077", "--cores", "2", "--memory", "1g"]
    depends_on:
      spark-master: {condition: service_healthy}
    ports:
      - "127.0.0.1:8082:8081"
    mem_limit: 1536m
    healthcheck: *worker-health

  # ---------------- Neo4j + GDS ----------------
  neo4j:
    image: neo4j:5.26-community
    container_name: neo4j
    hostname: neo4j
    restart: unless-stopped
    networks: [kgnet]
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
      NEO4J_PLUGINS: '["graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: "gds.*"
      NEO4J_dbms_security_procedures_allowlist: "gds.*,db.*"
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1g
      NEO4J_server_memory_pagecache_size: 512m
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_plugins:/plugins
      - ../neo4j/import:/import
    mem_limit: 2g
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  # ---------------- Jupyter (Spark driver) ----------------
  jupyter:
    build:
      context: pyspark
    image: kg/pyspark:3.5.0
    container_name: jupyter
    hostname: jupyter
    restart: unless-stopped
    networks: [kgnet]
    depends_on:
      namenode: {condition: service_healthy}
      spark-master: {condition: service_healthy}
      neo4j: {condition: service_healthy}
    ports:
      - "127.0.0.1:8888:8888"
      - "127.0.0.1:4040:4040"
    env_file: ../.env
    environment:
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:-}
      PYSPARK_PYTHON: python3          # resolves to Python 3.11 on both driver and workers
      SPARK_MASTER_URL: spark://spark-master:7077
      HDFS_URL: hdfs://namenode:9000
      NEO4J_URI: bolt://neo4j:7687
      DFS_REPLICATION: "2"
      SPARK_DRIVER_MEMORY: 1g
      SPARK_EXECUTOR_MEMORY: 768m
      SPARK_CORES_MAX: "4"
    volumes:
      - ../notebooks:/home/jovyan/work/notebooks
      - ../spark_jobs:/home/jovyan/work/spark_jobs
      - ../analytics:/home/jovyan/work/analytics
      - ../eval:/home/jovyan/work/eval
      - ../docs:/home/jovyan/work/docs
      - ../scripts:/home/jovyan/work/scripts
      - ../tests:/home/jovyan/work/tests
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8888/api"]
      interval: 15s
      timeout: 5s
      retries: 10

  # ---------------- App services (profile "apps": `make up-apps`) ----------------
  # crawler, extraction, loader (Phases 1-3), graphrag (5), api + ui (7).
  # One-off runs work without the profile: `make crawl`.
  crawler:
    build:
      context: ../services/crawler
    image: kg/crawler:latest
    container_name: crawler
    profiles: [apps]
    restart: unless-stopped
    networks: [kgnet]
    env_file: ../.env
    environment:
      HDFS_NAMENODE_HTTP: http://namenode:9870
      CRAWLER_CONFIG: /app/config/sources.yaml
    depends_on:
      namenode: {condition: service_healthy}
    volumes:
      - ../services/crawler/config:/app/config:ro
      - ../data/local:/data/local:ro
      - ../tests:/app/tests:ro
    ports: ["127.0.0.1:8001:8000"]
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  extraction:
    build:
      context: ../services/extraction
    image: kg/extraction:latest
    container_name: extraction
    profiles: [apps]
    restart: unless-stopped
    networks: [kgnet]
    env_file: ../.env
    environment:
      HDFS_URL: hdfs://namenode:9000
      DFS_REPLICATION: "2"
      LLM_CALL_LOG: /app/logs/llm_calls.jsonl
      EXTRACTION_CACHE_DIR: /data/cache/extraction
    depends_on:
      namenode: {condition: service_healthy}
    volumes:
      - ../data/cache:/data/cache
      - ../logs:/app/logs
      - ../eval:/app/eval
      - ../tests:/app/tests:ro
      - fastembed_cache:/home/jovyan/.cache/fastembed
    ports: ["127.0.0.1:8002:8000"]
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  loader:                          # Phase 3: gold Delta -> Neo4j (one-shot: make neo4j-load)
    build:
      context: ../services/loader
    image: kg/loader:latest
    container_name: loader
    profiles: [apps]
    networks: [kgnet]
    env_file: ../.env
    environment:
      HDFS_URL: hdfs://namenode:9000
      DFS_REPLICATION: "2"
      NEO4J_URI: bolt://neo4j:7687
      EMBED_CACHE_DIR: /data/cache/embeddings
    depends_on:
      namenode: {condition: service_healthy}
      neo4j: {condition: service_healthy}
    volumes:
      - ../data/cache:/data/cache
      - ../logs:/app/logs
      - ../neo4j:/app/neo4j:ro
      - ../tests:/app/tests:ro
      - fastembed_cache:/home/jovyan/.cache/fastembed
    mem_limit: 2g

  graphrag:                        # Phase 5: GraphRAG assistant (CLI + FastAPI /ask); Phase 6 benchmark (eval/)
    build:
      context: ../services/graphrag
      additional_contexts:
        analytics: ../analytics
        extraction: ../services/extraction/extraction
    image: kg/graphrag:latest
    container_name: graphrag
    profiles: [apps]
    restart: unless-stopped
    networks: [kgnet]
    env_file: ../.env
    environment:
      NEO4J_URI: bolt://neo4j:7687
      LLM_CALL_LOG: /app/logs/llm_calls.jsonl
      GRAPHRAG_CACHE_DIR: /data/cache/graphrag
      JUDGE_CACHE_DIR: /data/cache/judge          # Phase 6 judge results (Groq)
    depends_on:
      neo4j: {condition: service_healthy}
    volumes:
      - ../data/cache:/data/cache
      - ../logs:/app/logs
      - ../eval:/app/eval
      - ../docs:/app/docs                 # Phase 6 report + figures
      - ../tests:/app/tests:ro
      - ../scripts:/app/scripts:ro        # report number check (tests)
      - fastembed_cache:/home/jovyan/.cache/fastembed
    ports: ["127.0.0.1:8003:8000"]
    mem_limit: 1536m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  api:                             # Phase 7: REST API (ask / analytics / provenance / metrics), API-key auth
    build:
      context: ../services/api
      args: {BASE: "kg/graphrag:latest"}   # built after graphrag (make demo)
    image: kg/api:latest
    container_name: api
    profiles: [apps]
    restart: unless-stopped
    networks: [kgnet]
    env_file: ../.env
    environment:
      NEO4J_URI: bolt://neo4j:7687
      LLM_CALL_LOG: /app/logs/llm_calls.jsonl
      GRAPHRAG_CACHE_DIR: /data/cache/graphrag
      API_LOG: /app/logs/api.jsonl
      EVAL_RESULTS_DIR: /app/eval/results
    depends_on:
      neo4j: {condition: service_healthy}
    volumes:
      - ../data/cache:/data/cache
      - ../logs:/app/logs
      - ../eval/results:/app/eval/results:ro
      - fastembed_cache:/home/jovyan/.cache/fastembed
    ports: ["127.0.0.1:8000:8000"]
    mem_limit: 1536m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  ui:                              # Phase 7: Streamlit UI (Ask / Analytics / Results); talks to the API
    build: {context: ../ui}
    image: kg/ui:latest
    container_name: ui
    profiles: [apps]
    restart: unless-stopped
    networks: [kgnet]
    environment:
      API_URL: http://api:8000
      UI_API_KEY: ${UI_API_KEY:-}
      RESULTS_DIR: /app/results
      FIGURES_DIR: /app/figures
    depends_on:
      api: {condition: service_healthy}
    volumes:
      - ../eval/results:/app/results:ro
      - ../docs/figures:/app/figures:ro
    ports: ["127.0.0.1:8501:8501"]
    mem_limit: 768m

networks:
  kgnet:
    name: kgnet

volumes:
  namenode:
  datanode1:
  datanode2:
  neo4j_data:
  neo4j_logs:
  neo4j_plugins:
  fastembed_cache:
